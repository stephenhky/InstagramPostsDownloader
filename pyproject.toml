[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-downloader"
version = "1.0.3a1"
description = "Download media from Instagram and Threads posts via a local web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.42.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "instaloader>=4.10.3",
    "python-dotenv>=1.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "boto3>=1.26.0",
    "tenacity>=8.2.0",
]

[project.scripts]
media-downloader = "media_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_downloader"]
